name: RssHub lite tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare verified CJK test font
        shell: python
        run: |
          import ast
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          tree = ast.parse(Path("src/infrastructure/rendering/font_manager.py").read_text(encoding="utf-8"))
          names = {"TABLE_FONT_URL", "TABLE_FONT_SHA256", "TABLE_FONT_SIZE"}
          values = {
              node.targets[0].id: ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign) and isinstance(node.targets[0], ast.Name)
              and node.targets[0].id in names
          }
          with urllib.request.urlopen(values["TABLE_FONT_URL"], timeout=120) as response:
              data = response.read()
          assert len(data) == values["TABLE_FONT_SIZE"]
          assert hashlib.sha256(data).hexdigest() == values["TABLE_FONT_SHA256"]
          font = Path(os.environ["RUNNER_TEMP"]) / "rsshub-lite-test-font.otf"
          font.write_bytes(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"RSSHUB_TABLE_FONT_PATH={font}\n")
      - name: Run Python tests
        run: python -m pytest -p pytest_asyncio.plugin tests -q
      - name: Run frontend tests
        run: node --test tests/frontend/basic-editing.test.mjs tests/frontend/overview-charts.test.mjs
      - name: Validate release package
        run: python scripts/package.py
